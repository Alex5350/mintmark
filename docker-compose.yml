name: mintmark

services:
  db:
    image: pgvector/pgvector@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a  # pg18
    container_name: mintmark-db
    environment:
      POSTGRES_USER: mintmark
      POSTGRES_PASSWORD: mintmark
      POSTGRES_DB: mintmark
    ports:
      - "5434:5432"
    volumes:
      # pg18+ layout: mount the parent so pg_upgrade can cross the mount
      # boundary (docker-library/postgres#37; pg18 refuses /data mounts).
      - mintmark_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mintmark -d mintmark"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e  # RELEASE.2025-09-07
    container_name: mintmark-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mintmark
      MINIO_ROOT_PASSWORD: mintmark-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mintmark_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbuckets:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 mintmark mintmark-dev-only &&
      mc mb --ignore-existing local/mintmark-images &&
      mc anonymous set none local/mintmark-images &&
      exit 0
      "

volumes:
  mintmark_pgdata:
  mintmark_miniodata:
