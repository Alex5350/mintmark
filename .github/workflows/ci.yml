name: ci

on:
  push:
    branches: [main]
  pull_request:

# Rapid pushes replace their own pending runs; the token never needs more
# than read access to the checkout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: cache nuget
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: mintmark-nuget-${{ hashFiles('backend/Directory.Packages.props') }}
      - run: dotnet restore
      - run: dotnet build --no-restore
      # Testcontainers needs Docker (present on ubuntu runners); the Six
      # Labors license notice is the single tolerated warning.
      - run: dotnet test --no-build --logger "console;verbosity=normal"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm build

  mobile:
    # The Expo app is not device-tested in CI (no simulator budget), but its
    # typecheck still belongs on every push: the app talks to the API through
    # a hand-written fetch client, so this is the compile-time check on its
    # hand-mirrored wire types. The request side of the contract is gated by
    # the openapi-diff job below.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec tsc --noEmit

  openapi-diff:
    # The OpenAPI document is committed; regenerating and diffing makes
    # breaking API changes visible in review, and the generated TS client is
    # diffed the same way. Together they gate the request side of the
    # contract; response shapes are hand-mirrored in the clients until
    # response schemas land (docs/open-questions.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: cache nuget
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: mintmark-nuget-${{ hashFiles('backend/Directory.Packages.props') }}
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: regenerate openapi document
        run: dotnet run --no-build --project src/Mintmark.Api -- --export-openapi
      - name: regenerate generated ts client
        run: pnpm -C ../packages/api-client generate
      - name: fail on drift
        # NOTE: git pathspecs resolve against the job's working-directory
        # (backend/), so the repo-root document needs the ../ prefix.
        run: |
          git diff --exit-code -- ../docs/openapi.json ../packages || {
            echo "::error::docs/openapi.json or packages/api-client drifted; regenerate with 'just openapi' and commit so the change is reviewable"
            exit 1
          }
