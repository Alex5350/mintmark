<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-label="Mintmark: one contract, three clients, grounded pipeline. Generated TS client everywhere; the model proposes, the catalog and the user dispose. Animated flows: colored dashes move along request paths; node borders breathe.">
  <title>Mintmark: one contract, three clients, grounded pipeline</title>
  <defs>
    <pattern id="fi-dark-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1B2737"/>
    </pattern>
  </defs>
  <style>
    .fi-dark-node { fill: #0E1620; stroke: #22304A; stroke-width: 1.2; }
    .fi-dark-edge { stroke: #1F2B3D; stroke-width: 1.5; fill: none; }
    .fi-dark-pulse { animation: fi-dark-pulse 3s ease-in-out infinite; }
    .fi-dark-flow-sky { stroke: #38BDF8; stroke-width: 2; fill: none; stroke-dasharray: 5 11; animation: fi-dark-dash-sky-f 1.5s linear infinite; }
    .fi-dark-flow-sky-b { animation-name: fi-dark-dash-sky-b; }
    .fi-dark-flow-emerald { stroke: #34D399; stroke-width: 2; fill: none; stroke-dasharray: 5 11; animation: fi-dark-dash-emerald-f 1.5s linear infinite; }
    .fi-dark-flow-emerald-b { animation-name: fi-dark-dash-emerald-b; }
    .fi-dark-flow-amber { stroke: #F59E0B; stroke-width: 2; fill: none; stroke-dasharray: 5 11; animation: fi-dark-dash-amber-f 1.5s linear infinite; }
    .fi-dark-flow-amber-b { animation-name: fi-dark-dash-amber-b; }
    .fi-dark-flow-rose { stroke: #F87171; stroke-width: 2; fill: none; stroke-dasharray: 5 11; animation: fi-dark-dash-rose-f 1.5s linear infinite; }
    .fi-dark-flow-rose-b { animation-name: fi-dark-dash-rose-b; }
    .fi-dark-packet { animation: fi-dark-ride 1.5s linear infinite; }
    @keyframes fi-dark-pulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .5; } }
    @keyframes fi-dark-ride { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @keyframes fi-dark-dash-sky-f { to { stroke-dashoffset: -16; } }
    @keyframes fi-dark-dash-sky-b { to { stroke-dashoffset: 16; } }
    @keyframes fi-dark-dash-emerald-f { to { stroke-dashoffset: -16; } }
    @keyframes fi-dark-dash-emerald-b { to { stroke-dashoffset: 16; } }
    @keyframes fi-dark-dash-amber-f { to { stroke-dashoffset: -16; } }
    @keyframes fi-dark-dash-amber-b { to { stroke-dashoffset: 16; } }
    @keyframes fi-dark-dash-rose-f { to { stroke-dashoffset: -16; } }
    @keyframes fi-dark-dash-rose-b { to { stroke-dashoffset: 16; } }
    @media (prefers-reduced-motion: reduce) { .fi-dark-flow-sky, .fi-dark-flow-emerald, .fi-dark-flow-amber, .fi-dark-flow-rose { animation: none; } .fi-dark-pulse, .fi-dark-packet { animation: none; } }
  </style>
